[package]
name = "izul-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PDF Studio Izul — proses UI, supervisor, dan asosiasi berkas"

[lib]
name = "izul_app"
path = "src/lib.rs"

[[bin]]
name = "pdf-studio-izul"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
izul-ipc.workspace = true
izul-model.workspace = true
izul-render.workspace = true
postcard.workspace = true
izul-store.workspace = true
izul-write.workspace = true
# 7.1.0: "Ke Word" — the package is built here, from the pages the worker reads.
izul-docx.workspace = true
rusqlite.workspace = true
image.workspace = true
regex = "1"

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 2.10.x: newer releases require tauri 2.12, which would move wry under the
# custom-protocol fixes of Phase 1 (bugs #2, #8) without anyone re-checking them.
tauri-plugin-updater = "=2.10.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Touchpad pinch reaches the page only with WebView2 pinch zoom on (pinch.rs).
# Pinned to the versions tauri-runtime-wry already links, so nothing new is
# built and the COM interfaces are the same types wry hands us.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "0.61"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    # SHAddToRecentDocs: the taskbar jump list (Phase 8).
    "Win32_UI_Shell",
]

[dev-dependencies]
izul-store.workspace = true
# Reads every stream of a redacted file, to prove what is not in it.
izul-redact.workspace = true
# Opens the parts of an exported .docx (7.1.0).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
