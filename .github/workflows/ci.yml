name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody fixes is a warning that hides the next one.
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Linux runs the same suite so a
        # platform-specific regression is caught by whichever one it breaks.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Both trees on both runners, which is what `fetch.sh` does by default
      # and what a developer machine ends up with. Fetching only the host's
      # made `the_vendored_pdfium_is_present_for_the_target_we_ship` fail on
      # the Linux runner: that test checks the library that actually ships to
      # users — the Windows one — and it is worth keeping meaningful on both
      # runners rather than weakening it to whatever the host happens to have.
      - name: Vendor the pinned PDFium
        shell: bash
        run: ./vendor/pdfium/fetch.sh

      # The OCR models (Phase 7), pinned by SHA-256 like PDFium is by tag.
      - name: Fetch the pinned OCR models
        shell: bash
        run: ./vendor/ocrs/fetch.sh

      # ONNX Runtime (DirectML build on Windows) and the background model,
      # pinned by SHA-256 (Phase 7).
      - name: Fetch ONNX Runtime and the background model
        shell: bash
        run: ./vendor/onnx/fetch.sh

      - name: Formatting
        run: cargo fmt --all --check

      # SPEC 0: unwrap, expect and panic are denied in production code by the
      # workspace lints. This is where that is enforced rather than hoped for.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # src-tauri/build.rs copies PDFium next to the binary it produces, so a
      # plain `cargo build` is enough to leave `target/<profile>/` ready for
      # `WorkerPaths::beside_current_exe` — no manual copy step needed here.
      # The integration tests read `vendor/pdfium/` directly instead (see
      # `tests/crash_isolation.rs`), so they need nothing extra either.
      # `--workspace` matters: the application spawns `izul-worker` as a
      # separate process, and nothing about building the app alone rebuilds
      # that binary. A stale worker speaks an older wire protocol and misreads
      # every message — which is exactly how a `Ping` once arrived as a
      # `Shutdown` on a developer machine.
      - name: Build
        run: cargo build --workspace

      - name: Generate benchmark fixtures
        shell: bash
        run: |
          python3 -m pip install --quiet reportlab pikepdf pypdf pillow
          # `text` is the 500-page document the pipeline tests measure against;
          # `viewer` is the small one with an outline, mixed page sizes and a
          # page carrying its own /Rotate, which is what the Phase 1 render
          # tests need in order to guard anything.
          python3 bench/make_fixtures.py test-fixtures text viewer

      # A silently skipped integration test guards nothing, so a missing
      # prerequisite fails the build here instead of printing a note nobody reads.
      - name: Test
        env:
          IZUL_REQUIRE_FIXTURES: "1"
        run: cargo test --workspace

      # SPEC 17, Phase 6: what is redacted cannot be found again by any
      # extraction tool. Six extractors that share no code look for the
      # secret in twelve kinds of page after the application's own redaction;
      # MuPDF and poppler are also the independent renderers that show
      # nothing outside the areas moved. Linux only: the tools are one apt
      # line there, and the routine under test is the same on both runners.
      - name: Redaction proof
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y poppler-utils mupdf-tools fonts-dejavu-core fonts-liberation
          python3 -m pip install --quiet pdfminer.six
          python3 tools/redaction-proof/run.py --out redaction-proof.txt

      # Phase 7: scanned pages read by the application's own OCR, then read
      # back by four extractors that are not PDFium — accuracy, word
      # positions, and a render that must not change by one pixel.
      - name: OCR proof
        if: runner.os == 'Linux'
        run: python3 tools/ocr-proof/run.py --out ocr-proof.txt

      # Phase 7: "Hapus Latar" scored against masks drawn with the pictures.
      - name: Background removal proof
        if: runner.os == 'Linux'
        run: python3 tools/background-proof/run.py --out background-proof.txt

      # Phase 7: a form filled by the worker's routine reads as filled in
      # pypdf, poppler and MuPDF — values and appearances — while the same
      # values written as /V alone must fail.
      - name: Form filling proof
        if: runner.os == 'Linux'
        run: python3 tools/form-proof/run.py --out form-proof.txt

      # The Windows runtime as the application loads it: onnxruntime.dll and
      # DirectML.dll beside the executable (src-tauri/build.rs put them in
      # target/debug). Prints where the model ran — DirectML on the runner's
      # software adapter, or the CPU and why — and fails only if nothing ran.
      - name: DirectML probe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 tools/background-proof/make_pictures.py probe
          ./target/debug/bg-probe.exe target/debug/onnxruntime.dll vendor/onnx/u2netp.onnx probe/stempel.png probe/stempel.out.png
          # No GPU here: once more with DirectML allowed on the software adapter,
          # so the model runs through DirectML itself, not only up to its
          # choice of device.
          BG_ANY_ADAPTER=1 BG_KIND=paper ./target/debug/bg-probe.exe target/debug/onnxruntime.dll vendor/onnx/u2netp.onnx probe/stempel.png probe/stempel.dml.png

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # SPEC 0: strict, noUncheckedIndexedAccess, and no `any`.
      - run: npm run typecheck
      - run: npm run lint
      # Pure modules — layout, geometry, prediction, text grouping — carry the
      # rules the viewport is built on, and SPEC 16 asks for them to be tested.
      - run: npm test
      - run: npm run build

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version.json is the single source of truth (SPEC 0). Three files repeat
      # it, and a mismatch would reach the user as an installer that disagrees
      # with the About box.
      - name: version.json matches every manifest
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          echo "version.json: $V"
          grep -q "^version = \"$V\"" Cargo.toml \
            || { echo "Cargo.toml workspace version != $V"; exit 1; }
          grep -q "\"version\": \"$V\"" package.json \
            || { echo "package.json version != $V"; exit 1; }
          grep -q "\"version\": \"$V\"" src-tauri/tauri.conf.json \
            || { echo "tauri.conf.json version != $V"; exit 1; }
          echo "all manifests agree"
