[package]
name = "izul-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "spike"
path = "src/spike.rs"

[[bin]]
name = "viewport"
path = "src/viewport.rs"

# Phase 2's pass criteria: fifty documents open, and no drift after two hundred
# open/close cycles. Unix-only, because it reads the resident set from /proc;
# on Windows the numbers come from a real run instead.
[[bin]]
name = "multidoc"
path = "src/multidoc.rs"

# Backend for the UI screenshot harness (`npm run ui:shots`): renders the tiles
# and annotation display lists the mocked webview asks for, with the same
# PDFium and the same builders the application uses. Stdin/stdout only, so it
# builds on every runner.
[[bin]]
name = "ui-harness"
path = "src/ui_harness.rs"

# Phase 4's files for checking in Acrobat, Chrome and Edge (TESTING.md).
[[bin]]
name = "fase4-uji"
path = "src/fase4_uji.rs"

# Phase 5's page-rearrangement timings.
[[bin]]
name = "fase5-uji"
path = "src/fase5_uji.rs"

# Phase 6: runs the application's own redaction on the proof cases, for
# tools/redaction-proof/run.py to check with independent extractors.
[[bin]]
name = "redact-proof"
path = "src/redact_proof.rs"

[[bin]]
name = "ocr-probe"
path = "src/ocr_probe.rs"

[[bin]]
name = "bg-probe"
path = "src/bg_probe.rs"

[[bin]]
name = "form-probe"
path = "src/form_probe.rs"

[dependencies]
izul-ocr.workspace = true
izul-pdf.workspace = true
izul-ipc.workspace = true
izul-render.workspace = true
izul-model.workspace = true
izul-write.workspace = true
izul-redact.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process", "sync"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The harness reports timings; a panic in it is a bug in the harness, not a
# production failure path, so the strict production lints are relaxed here.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
