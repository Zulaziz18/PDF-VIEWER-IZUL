[workspace]
resolver = "2"
members = [
    "crates/izul-model",
    "crates/izul-pdf",
    "crates/izul-render",
    "crates/izul-ipc",
    "crates/izul-worker",
    "crates/izul-store",
    "crates/izul-write",
    "crates/izul-redact",
    "crates/izul-ocr",
    "bench",
    "tests-integration",
    "src-tauri",
]

[workspace.package]
version = "7.0.0-alpha.6"
edition = "2021"
rust-version = "1.94"
license = "Proprietary"
authors = ["PDF Studio Izul"]

[workspace.dependencies]
izul-model = { path = "crates/izul-model" }
izul-pdf = { path = "crates/izul-pdf" }
izul-render = { path = "crates/izul-render" }
izul-ipc = { path = "crates/izul-ipc" }
izul-store = { path = "crates/izul-store" }
izul-write = { path = "crates/izul-write" }
izul-redact = { path = "crates/izul-redact" }
izul-ocr = { path = "crates/izul-ocr" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
rayon = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
blake3 = "1"
parking_lot = "0.12"
bytemuck = "1"
memmap2 = "0.9"
anyhow = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"

# The OCR engine is numeric code that runs ~70x slower unoptimised: 55 s for
# one page in a debug build against 0.75 s in release, far past the 6 s a
# worker may stay silent before the supervisor takes it for hung. So it is
# optimised even in `npm run tauri dev`; our own crates stay debuggable.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"      # catch_unwind at the PDFium FFI boundary needs unwinding
strip = "debuginfo"

[profile.bench-spike]
inherits = "release"
debug = 1
