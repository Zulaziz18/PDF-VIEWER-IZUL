[package]
name = "izul-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Phase 6: the redactor, driven and checked from here (`redaction.rs`).
izul-redact.workspace = true
izul-model.workspace = true
pdfium-render.workspace = true
memmap2.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
# PNG and JPEG encoding. Since Phase 4 the crate hands pictures back out of
# saved annotations (`izul.rs`) and renders pages to image files for export;
# `pdfium-render`'s `image_025` feature already builds this crate.
image.workspace = true

[dev-dependencies]
# JSON for the display-list dumps the canvas-parity harness reads.
serde_json.workspace = true
# The Phase 4 round trip writes with the real writer.
izul-write.workspace = true
# Opens every stream of a saved file to prove what is — and is not — in it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
