[package]
name = "izul-write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Writes saved files. No PDFium: the worker has already produced the document
# with PDFium; this crate appends the annotation objects PDFium's public API
# cannot express (appearance streams with their resources) and performs the
# atomic replace. It runs in the UI process, which owns the user's files.
[dependencies]
izul-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Storage_FileSystem", "Win32_Foundation"]

[lints]
workspace = true
