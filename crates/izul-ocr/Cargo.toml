[package]
name = "izul-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Local OCR (SPEC 17): PP-OCR models (Apache-2.0) run by ONNX Runtime, the
# same runtime as background removal. The models are not in the repository;
# vendor/ocr/fetch.sh fetches them, pinned, and the installer bundles them.
[dependencies]
izul-pdf.workspace = true
thiserror.workspace = true
serde.workspace = true
# Background removal (Phase 7): ONNX Runtime, loaded at run time from the
# library shipped beside the application (`load-dynamic`) — never downloaded
# by the build — with DirectML on Windows. See vendor/onnx/fetch.sh.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "api-24"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
