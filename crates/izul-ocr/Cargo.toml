[package]
name = "izul-ocr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Local OCR (SPEC 17, Phase 7): `ocrs`, pure Rust — nothing to build in C++ on
# the user's machine. The models are not in the repository; see
# vendor/ocrs/fetch.sh and the licence note in CLAUDE.md before shipping them.
[dependencies]
izul-pdf.workspace = true
thiserror.workspace = true
serde.workspace = true
ocrs = { version = "=0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
# Background removal (Phase 7): ONNX Runtime, loaded at run time from the
# library shipped beside the application (`load-dynamic`) — never downloaded
# by the build — with DirectML on Windows. See vendor/onnx/fetch.sh.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "api-24"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
